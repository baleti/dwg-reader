name: ci
on: [push, pull_request]
jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64 }
          - { os: windows-latest, target: x64 }
          - { os: macos-13,       target: x86_64 }
          - { os: macos-latest,   target: aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: dwgfast
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - name: install wheel and import it (abi3-py39 wheel, any Python >= 3.9)
        shell: bash
        run: |
          python -m pip install --no-index --find-links dwgfast/dist dwgfast
          python -c "import dwgfast; print(dwgfast.__file__)"
      - uses: actions/upload-artifact@v4
        with: { name: wheel-${{ matrix.os }}, path: dwgfast/dist/*.whl }
  cargo-check:
    strategy:
      matrix: { os: [ubuntu-latest, windows-latest, macos-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release --manifest-path dwgfast/Cargo.toml
